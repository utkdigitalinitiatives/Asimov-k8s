apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The solr-system namespace override lives in ./solr-system so that components
# with their own namespace (or cluster-scoped only) are not forced into it.
resources:
  - solr-system
  - ../base/gateway-api
  - ../base/nginx-gateway-fabric

commonLabels:
  environment: production
