apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NGINX Gateway Fabric: everything (Flux objects, RBAC, control plane) lives in
# the nginx-gateway namespace. Included directly by infrastructure/production,
# outside the solr-system namespace override.
resources:
  - namespace.yaml
  - flux-rbac.yaml
  - helm-release.yaml
