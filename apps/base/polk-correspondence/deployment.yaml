apiVersion: apps/v1
kind: Deployment
metadata:
  name: polk-correspondence
  namespace: polk-correspondence
  labels:
    app.kubernetes.io/name: polk-correspondence
    app.kubernetes.io/component: polk-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: polk-correspondence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polk-correspondence
        app.kubernetes.io/component: polk-webapp
    spec:
      nodeSelector:
        kubernetes.azure.com/mode: user
      containers:
        - name: polk-correspondence
          image: libdiacr.azurecr.io/polk-correspondence:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 512m
              memory: 768Mi
          # eXist can take several minutes to start. The startup probe allows up
          # to 6 min, and readiness waits until the Polk page actually renders.
          startupProbe:
            httpGet:
              path: /exist/apps/polk-papers/polk.xml?odd=polk.odd
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /exist/apps/polk-papers/polk.xml?odd=polk.odd
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
