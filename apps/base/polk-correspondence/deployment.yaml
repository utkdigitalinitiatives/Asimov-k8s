apiVersion: apps/v1
kind: Deployment
metadata:
  name: polk-correspondence
  namespace: polk-correspondence
  labels:
    app.kubernetes.io/name: polk-correspondence
    app.kubernetes.io/component: polk-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: polk-correspondence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polk-correspondence
        app.kubernetes.io/component: polk-webapp
    spec:
      nodeSelector:
        kubernetes.azure.com/mode: user
      containers:
        - name: polk-correspondence
          image: libdiacr.azurecr.io/polk-correspondence:latest
          ports:
            - containerPort: 8080
              name: http
          # Overrides the image's JAVA_TOOL_OPTIONS (-Xms128m -Xmx384m). Java 8u181
          # doesn't cap metaspace or direct buffers by default. Setting explicit caps
          # keeps total JVM memory (~1.2-1.4Gi max) under the container limit, so
          # running out shows up as an OutOfMemoryError in the logs, not a silent
          # OOMKill.
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Xms512m -Xmx768m
                -XX:MaxMetaspaceSize=192m
                -XX:MaxDirectMemorySize=128m
                -XX:ReservedCodeCacheSize=128m
                -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
          # At 768Mi the pod hit 728Mi within 20 min and was OOMKilled
          # (2026-09-30), so leave plenty of room above the JVM caps set above.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
          # eXist can take several minutes to start. The startup probe allows up
          # to 6 min, and readiness waits until the Polk page actually renders.
          startupProbe:
            httpGet:
              path: /exist/apps/polk-papers/polk.xml?odd=polk.odd
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /exist/apps/polk-papers/polk.xml?odd=polk.odd
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
