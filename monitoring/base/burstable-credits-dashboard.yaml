---
# Grafana dashboard for burstable (B-series) VM CPU credits, from azure-metrics-exporter.yaml
# (series azure_metric_vmss{metric="CPU Credits Remaining"}), auto-loaded by the
# kube-prometheus-stack Grafana sidecar (grafana_dashboard label). Thresholds match
# azure-vm-alerts.yaml. New scale sets added to the exporter show up in the "Scale set" picker.
# Generated by scratchpad gen_credits_dashboard.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: burstable-credits-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: kube-prometheus-stack
data:
  burstable-credits.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "refresh": "1m",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "azure",
        "burstable",
        "vm"
      ],
      "templating": {
        "list": [
          {
            "name": "vmss",
            "label": "Scale set",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(azure_metric_vmss{metric=\"CPU Credits Remaining\"}, resourceName)",
            "query": {
              "query": "label_values(azure_metric_vmss{metric=\"CPU Credits Remaining\"}, resourceName)",
              "refId": "vmss"
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          }
        ]
      },
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Burstable VM CPU Credits",
      "uid": "azure-burstable-credits",
      "version": 1,
      "weekStart": "",
      "panels": [
        {
          "id": 1,
          "title": "Credits left now",
          "description": "CPU Credits Remaining per instance. Orange below 200 and red below 30 match the AzureVMCPUCreditsLow / AzureVMCPUCreditsExhausted alerts.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "azure_metric_vmss{metric=\"CPU Credits Remaining\", resourceName=~\"$vmss\"}",
              "legendFormat": "{{ dimension }}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 30
                  },
                  {
                    "color": "green",
                    "value": 200
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Change per hour (last 30 min)",
          "description": "Positive: the bank is refilling (~+35/h when idle). Negative: CPU is above the 30% baseline and the bank is draining.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "deriv(azure_metric_vmss{metric=\"CPU Credits Remaining\", resourceName=~\"$vmss\"}[30m]) * 3600",
              "legendFormat": "{{ dimension }}",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Time until empty at this rate",
          "description": "Credits left divided by the current drain rate. Only shown while the bank is draining.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "azure_metric_vmss{metric=\"CPU Credits Remaining\", resourceName=~\"$vmss\"} / -(deriv(azure_metric_vmss{metric=\"CPU Credits Remaining\", resourceName=~\"$vmss\"}[30m]) * 3600 < 0)",
              "legendFormat": "{{ dimension }}",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 6
                  }
                ]
              },
              "noValue": "Not draining"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Credits remaining",
          "description": "One line per instance. Every deploy creates a new instance, which starts at ~60 credits and refills in ~24 h.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "azure_metric_vmss{metric=\"CPU Credits Remaining\", resourceName=~\"$vmss\"}",
              "legendFormat": "{{ resourceName }} / {{ dimension }}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {
                  "mode": "line+area"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 30
                  },
                  {
                    "color": "transparent",
                    "value": 200
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "How burstable credits work",
          "type": "text",
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "options": {
            "mode": "markdown",
            "content": "A B-series VM earns credits while CPU is below its baseline (30% on `Standard_B2als_v2`, +36/hour) and spends them above it. At 0 the VM is held to the baseline and the site slows.\n\n* **Credits belong to the instance.** Every deploy starts over at ~60 and takes ~24 h to fill (full is ~924 on mccarthy).\n* Full load on both vCPUs drains ~84/hour.\n* Alerts to Teams: below 200 and falling (warning), below 30 (critical), no data for 30 min. Rules: `asimov/monitoring/base/azure-vm-alerts.yaml`.\n* To add a VM: give `id-asimov-azure-metrics` Monitoring Reader on its resource group and add its scale set to `azure-metrics-exporter.yaml`."
          }
        }
      ]
    }
