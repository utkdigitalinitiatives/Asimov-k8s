---
# webdevops azure-metrics-exporter: turns Azure Monitor platform metrics into Prometheus series, so
# VM-level signals that nothing inside the cluster can see (burstable CPU credits) alert through the
# same Alertmanager -> Teams path as the blackbox probes. Rules: azure-vm-alerts.yaml.
#
# Auth is workload identity, like External Secrets. Lives in Azure only, nothing in Git:
#   - managed identity `id-asimov-azure-metrics` (rg-asimov), client ID in the annotation below
#   - federated credential `fc-asimov-azure-metrics`, subject
#     system:serviceaccount:monitoring:azure-metrics-exporter (renaming the ServiceAccount breaks it)
#   - `Monitoring Reader` on MCCARTHY-PRODUCTION-RG (read-only; add a scope to watch another site)
# The exporter lists subscriptions at startup and exits if it cannot log in, so the identity must
# exist before this is merged.
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: webdevops
  namespace: monitoring
spec:
  interval: 24h
  url: https://webdevops.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azure-metrics-exporter
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: azure-metrics-exporter
      version: '>=1.2.11 <1.3.0'
      sourceRef:
        kind: HelmRepository
        name: webdevops
        namespace: monitoring
      interval: 12h
  install:
    remediation:
      retries: 3
  values:
    fullnameOverride: azure-metrics-exporter

    serviceAccount:
      create: true
      name: azure-metrics-exporter
      annotations:
        azure.workload.identity/client-id: "60687375-39f1-4f56-bd12-24bb0e5a4ca2"
    podLabels:
      azure.workload.identity/use: "true"
    env:
      AZURE_AUTH: workloadidentity

    # Chart default requests 100m / 200Mi; the user pool is tight (see NodeCPURequests alerts).
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    nodeSelector:
      kubernetes.azure.com/mode: user

    # The chart's NetworkPolicy denies all ingress, Prometheus included. The cluster enforces no
    # network policy today (networkPolicy: none), so it would only bite the day that changes.
    netpol:
      enabled: false

    prometheus:
      # Scrape the exporter's own /metrics (azurerm_stats_metric_requests shows Azure API errors).
      monitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

      # One ServiceMonitor per probe; each scrape is one Azure Monitor API call (~43k/month at 1m,
      # inside the free 1M). Series: azure_metric_vmss{metric="...", resourceName="...",
      # dimension="<instance name>"}. Split by VMName so a deploy's new instance (it starts with
      # ~60 credits) is its own series instead of dragging the scale set's number down.
      # timespan PT10M + interval PT1M: the exporter keeps the newest non-empty minute, so Azure's
      # few minutes of ingestion lag never empties the series. A gone instance's series keeps its
      # last real value for those 10 minutes, then drops out. (`az monitor metrics list` prints
      # empty minutes as 0.0; the raw API leaves the value out, and the exporter skips them.)
      metricProbes:
        path: /probe/metrics/resource
        interval: 1m
        params:
          subscription: ["9fc717ef-b8c4-4858-a677-7c7b518616a0"]
          interval: ["PT1M"]
          timespan: ["PT10M"]
        probes:
          - name: burstable-vmss
            params:
              name: ["azure_metric_vmss"]
              target:
                - /subscriptions/9fc717ef-b8c4-4858-a677-7c7b518616a0/resourceGroups/MCCARTHY-PRODUCTION-RG/providers/Microsoft.Compute/virtualMachineScaleSets/mccarthy-production-vmss
              metric: ["CPU Credits Remaining"]
              aggregation: ["average"]
              metricFilter: ["VMName eq '*'"]
