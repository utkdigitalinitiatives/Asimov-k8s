---
# Endpoints probed by blackbox-exporter for external up/down + response-time + cert-expiry.
# Each target becomes a Prometheus scrape of the exporter's /probe endpoint; the resulting
# series carry instance=<url> plus a friendly `site` label (added via relabeling) used by the
# alerts and the "Endpoint Uptime" dashboard.
#
# Verified reachable from an in-cluster pod (hairpin to each Traefik LB works):
#   - grafana.lib.utk.edu            -> 302 -> /login -> 200  (Asimov Traefik 68.220.244.21)
#   - mainsite.libsolr.lib.utk.edu   -> 200 on /solr/ (no auth needed for the up-check)
#   - etd.utk.edu                    -> 200  (Vireo PROD, now on-cluster: the vireo-traefik-prod
#                                             LoadBalancer 74.249.33.88, its own IP from the
#                                             VM->cluster migration; not the VM anymore)
#   - cormacmccarthy.lib.utk.edu     -> 200  (Drupal on the mccarthy Azure VM, Apache/Rocky;
#                                             not on this cluster, but its search uses solr-mainsite)
#   - lib.utk.edu                    -> 200  (main library website: Drupal 10 on Pantheon behind
#                                             Fastly, NOT on this cluster. Added Sept 3, 2026
#                                             after a hosting-provider 503 went unnoticed until
#                                             a user filed a ticket. Its search uses the Solr
#                                             and Redis that DO run here.)
#   - polk.lib.utk.edu               -> 307 -> polk.xml -> 200  (Polk Correspondence, eXist-db,
#                                             on-cluster behind Asimov Traefik 68.220.244.21.
#                                             Added Sept 30, 2026.)
#
# Deliberately NOT probed: test.etd.utk.edu (cluster vireo-test) currently returns 503 (no
# healthy backend) and would alert down permanently — add it once the test app is serving.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: public-endpoints
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  jobName: blackbox-http
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://grafana.lib.utk.edu
        - https://mainsite.libsolr.lib.utk.edu/solr/
        - https://etd.utk.edu
        - https://lib.utk.edu
        - https://polk.lib.utk.edu
        - https://cormacmccarthy.lib.utk.edu
      relabelingConfigs:
        - sourceLabels: [__param_target]
          regex: https://grafana\.lib\.utk\.edu.*
          targetLabel: site
          replacement: Grafana
        - sourceLabels: [__param_target]
          regex: https://mainsite\.libsolr\.lib\.utk\.edu.*
          targetLabel: site
          replacement: Solr (mainsite)
        - sourceLabels: [__param_target]
          regex: https://etd\.utk\.edu.*
          targetLabel: site
          replacement: Vireo ETD (prod)
        - sourceLabels: [__param_target]
          regex: https://lib\.utk\.edu.*
          targetLabel: site
          replacement: Main site (lib.utk.edu)
        - sourceLabels: [__param_target]
          regex: https://polk\.lib\.utk\.edu.*
          targetLabel: site
          replacement: Polk Correspondence (polk.lib.utk.edu)
        - sourceLabels: [__param_target]
          regex: https://cormacmccarthy\.lib\.utk\.edu.*
          targetLabel: site
          replacement: Cormac McCarthy (cormacmccarthy.lib.utk.edu)
---
# On-campus servers (replacing Uptime Kuma). Checked over HTTPS with https_2xx_any_cert,
# which skips the cert check, because most of them send a cert for a different name. Not
# plain HTTP: OIT plans to block port 80 at the campus firewall. All tested from an
# in-cluster pod on Oct 29, 2026 (the OIT firewall lets the cluster reach port 443):
#   - data.lib.utk.edu     200; cert is for dlstore.lib.utk.edu (bare metal)
#   - raven.lib.utk.edu    200; cert is for alchemy.lib.utk.edu (VM)
#   - kiwi.lib.utk.edu     200; cert matches
#   - magpie.lib.utk.edu   200; cert is for didash.lib.utk.edu
#   - oriole.lib.utk.edu   302 -> /login -> 200; cert is for withdraw.lib.utk.edu
#   - ale.lib.utk.edu      200 (bot-check page); cert is for digital.lib.utk.edu
# dlprocess is in the campus-servers-tcp Probe below.
#
# Limits: the cluster cannot ping (Azure drops outbound ICMP), and it cannot reach campus
# private IPs or SSH. heron, porter, lambic, griffin and esb answer only on campus (the OIT
# firewall drops the cluster on every port), so they wait for the campus-side Alloy agent
# (Vikunja card #46). esb lost its only cluster-visible port when Apache was turned off on
# Oct 29, 2026 (it served an old trace.utk.edu Drupal 7 site that should not be there); on
# campus it still answers on 22 and on 8080 (Tomcat). athena.lib.utk.edu is private and is
# set aside for now.
#
# The site label is built from the host name, so a new *.lib.utk.edu server needs only a
# new target line.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: campus-servers
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  jobName: blackbox-http-campus
  interval: 30s
  module: https_2xx_any_cert
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://data.lib.utk.edu
        - https://raven.lib.utk.edu
        - https://kiwi.lib.utk.edu
        - https://magpie.lib.utk.edu
        - https://oriole.lib.utk.edu
        - https://ale.lib.utk.edu
      relabelingConfigs:
        - sourceLabels: [__param_target]
          regex: https://([^./]+)\.lib\.utk\.edu.*
          targetLabel: site
          replacement: ${1} (campus server)
---
# Campus servers whose HTTPS cannot pass an HTTP check, so we only check that port 443
# accepts a TCP connection (like Uptime Kuma's "TCP Port" monitor). No TLS here on purpose.
#   - dlprocess.lib.utk.edu  Apache test page, 403 on /; self-signed cert expired 2021, which
#                            would fire EndpointCertExpiringSoon forever if probed over TLS.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: campus-servers-tcp
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  jobName: blackbox-tcp-campus
  interval: 30s
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - dlprocess.lib.utk.edu:443
      relabelingConfigs:
        - sourceLabels: [__param_target]
          regex: ([^.:/]+)\.lib\.utk\.edu:443
          targetLabel: site
          replacement: ${1} (campus server)
